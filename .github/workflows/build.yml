name: Compile AOSP Fast

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout du dépôt
      uses: actions/checkout@v4

    - name: Installer les outils nécessaires
      run: |
        sudo apt-get update
        # Version nettoyée au maximum avec uniquement les outils requis et compatibles 22.04
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libncurses5 x1lsb-release libxml2-utils xsltproc unzip bc python3

    - name: Installer l'outil Repo de Google
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "PATH=~/bin:$PATH" >> $GITHUB_ENV

    - name: Télécharger le code source Android 11
      run: |
        git config --global user.name "wix000legende"
        git config --global user.email "contact@example.com"
        mkdir aosp && cd aosp
        ~/bin/repo init -u https://android.googlesource.com/platform/manifest -b android-11.0.0_r48 --depth=1
        ~/bin/repo sync -c -j16 --no-tags --no-clone-bundle

    - name: Lancer la compilation
      run: |
        cd aosp
        source build/envsetup.sh
        lunch aosp_arm64-userdebug
        make -j16
