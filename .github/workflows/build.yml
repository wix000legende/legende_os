name: Build Legende OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cleanup & Prepare Space
        run: |
          # Suppression des outils lourds inutiles
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc

      - name: Init Repo & Sync
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          mkdir android_build
          cd android_build
          # Utilisation de --depth=1 pour éviter de télécharger tout l'historique
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r0.1 --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc)

      - name: Build Legende OS
        run: |
          cd android_build
          source build/envsetup.sh
          # Configuration pour émulateur PC
          lunch aosp_x86_64-userdebug
          mka -j$(nproc)
