name: Build AOSP x86_64 for VirtualBox

on:
  workflow_dispatch: # Permet de lancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-20.04 # Ubuntu 20.04 est requis pour Android 11
    timeout-minutes: 360 # Limite stricte de 6 heures (360 min)
    
    steps:
      # 1. Récupération du code
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Installation des dépendances (Obligatoire pour AOSP)
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y repo curl git python3 bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev maven openjdk-11-jdk
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 3. Initialisation du dépôt AOSP (Branch Android 11)
      - name: Initialize Repo
        run: |
          mkdir -p workspace
          cd workspace
          # Utilisation du manifeste officiel Android 11
          repo init -u https://android.googlesource.com/platform/manifest -b android-11.0.0_r48 --git-lfs --depth=1

      # 4. (Optionnel) Injection de vos modifications personnelles
      # Si vous avez un fichier roomservice.xml pour ajouter des apps/frameworks x86_64
      - name: Setup Local Manifest (Optional)
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          # Décommentez la ligne ci-dessous et mettez votre lien si vous avez un roomservice.xml
          # curl -o .repo/local_manifests/roomservice.xml https://raw.githubusercontent.com/VOTRE_USER/VOTRE_DEPOT/main/roomservice.xml
          echo "No local manifest added by default."

      # 5. Synchronisation du code (Le plus long)
      - name: Sync Repo
        run: |
          cd workspace
          # -c : charge seulement la branche courante (gain de temps)
          # -j : utilise tous les coeurs
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      # 6. Configuration de l'environnement de build (CIBLE x86_64)
      - name: Setup Build Env
        run: |
          cd workspace
          source build/envsetup.sh
          # C'est ici que la magie opère pour VirtualBox : on cible x86_64
          lunch aosp_x86_64-eng
          # Activation de ccache pour accélérer (si le cache GitHub fonctionne)
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G -s
   
