name: Build AOSP x86_64 for VirtualBox

on:
  workflow_dispatch: # Lance uniquement quand vous cliquez sur le bouton

jobs:
  build:
    runs-on: ubuntu-22.04 # Spécifique pour Android 11
    timeout-minutes: 360  # Limite de 6 heures (max gratuit)

    steps:
      # 1. Récupère votre code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Installe les outils de compilation Android
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y repo curl git python3 bc bison build-essential ccache flex gperf libxml2-utils wget zip unzip openjdk-11-jdk
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 3. Télécharge le code source d'Android 11
      - name: Initialize Repo
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u https://android.googlesource.com/platform/manifest -b android-11.0.0_r48 --git-lfs --depth=1

      # 4. (Optionnel) Ajoutez vos modifications si vous avez un fichier roomservice.xml
      - name: Setup Local Manifest
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          # Décommentez la ligne suivante si vous avez créé un fichier roomservice.xml dans votre dépôt
          # curl -o .repo/local_manifests/roomservice.xml https://raw.githubusercontent.com/VOTRE_PSEUDO/VOTRE_DEPOT/main/roomservice.xml

      # 5. Synchronise tout le code (Étape la plus longue)
      - name: Sync Repo
        run: |
          cd workspace
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      # 6. Configure pour PC (x86_64) et non pour téléphone
      - name: Setup Build Target
        run: |
          cd workspace
          source build/envsetup.sh
          lunch aosp_x86_64-eng
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G

      # 7. Lance la compilation
      - name: Build AOSP
        run: |
          cd workspace
          mka image -j$(nproc --all)

      # 8. Prépare les fichiers pour VirtualBox
      - name: Prepare Artifacts
        run: |
          mkdir -p output_vbox
          cp workspace/out/target/product/x86_64/system.img output_vbox/
          cp workspace/out/target/product/x86_64/kernel output_vbox/
          cp workspace/out/target/product/x86_64/ramdisk.img output_vbox/

      # 9. Vous permet de télécharger le résultat
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: AOSP-x86_64-Android11
          path: output_vbox/
          retention-days: 5   
