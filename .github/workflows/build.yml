name: Compile AOSP Fast

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout du dépôt
      uses: actions/checkout@v4

    - name: Libérer de l'espace disque sur le serveur GitHub
      run: |
        echo "=== Avant nettoyage ==="
        df -h
        # Suppression des gros outils inutiles préinstallés par GitHub
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "=== Après nettoyage ==="
        df -h

    - name: Installer les outils nécessaires
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc python3 lsb-release libncurses5

    - name: Installer l'outil Repo de Google
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "PATH=~/bin:$PATH" >> $GITHUB_ENV

    - name: Télécharger le code source (Version Ultra-Légère)
      run: |
        git config --global user.name "wix000legende"
        git config --global user.email "contact@example.com"
        mkdir aosp && cd aosp
        # On télécharge uniquement le strict minimum pour compiler
        ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1 && repo sync -c -j8 --no-tags --no-clone-bundle

    - name: Lancer la compilation
      run: |
        cd aosp
        source build/envsetup.sh
        lunch lineage_arm64-userdebug
        # On baisse à -j4 pour éviter que la mémoire vive (RAM) du serveur ne sature
        make -j4
