name: Compile Legende OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Créer un Swap de 16Go
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Installer les outils nécessaires
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Installer l'outil Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Télécharger le code source
        run: |
          mkdir workspace
          cd workspace
          # Utilisation de la branche stable Android 13
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r74
          # Téléchargement stable avec -j2
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j2

      - name: Lancer la compilation
        run: |
          cd workspace
          source build/envsetup.sh
          lunch aosp_arm64-eng
          export LC_ALL=C
          # Compilation utilisant le swap pour éviter les erreurs Out of Memory
          make -j8
